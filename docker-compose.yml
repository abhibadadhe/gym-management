services:
  # ============================================================================
  # 1. PostgreSQL 16 Database
  # ============================================================================
  postgres_db:
    image: postgres:16-alpine
    container_name: morya_fitness_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-morya_fitness_db}
      POSTGRES_USER: ${POSTGRES_USER:-morya_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MoryaFitnessStrongPassword2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-morya_admin} -d ${POSTGRES_DB:-morya_fitness_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. Django Backend (Gunicorn)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: morya_fitness_backend
    restart: always
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-prod-morya-fitness-super-secret-key-2026}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DATABASE_URL: postgres://${POSTGRES_USER:-morya_admin}:${POSTGRES_PASSWORD:-MoryaFitnessStrongPassword2026!}@postgres_db:5432/${POSTGRES_DB:-morya_fitness_db}
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    depends_on:
      postgres_db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py reset_data &&
             python manage.py collectstatic --noinput &&
             gunicorn morya_backend.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    expose:
      - "8000"

  # ============================================================================
  # 3. React Frontend (Nginx Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: morya_fitness_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      - backend
    volumes:
      - static_volume:/usr/share/nginx/html/static
      - media_volume:/usr/share/nginx/html/media

volumes:
  postgres_data:
  static_volume:
  media_volume:
